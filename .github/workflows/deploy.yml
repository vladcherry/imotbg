name: Deploy to Pages

on:
  push:
    branches: [main]
  # A push made with the built-in GITHUB_TOKEN does not trigger other
  # workflows, so the scrape job cannot rebuild Pages by pushing alone.
  # Chain off its completion instead.
  workflow_run:
    workflows: ["Update data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and the latest queued. Do NOT cancel in-progress runs: a cancelled
# deploy can leave the published site half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A workflow_run fires on every completion, including failures.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      # On workflow_run, GITHUB_SHA is the last commit on the default branch,
      # so this picks up the data commit the scrape job just pushed.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Collect demo data if there is no real data
        run: |
          if [ ! -f public/data/sofia.json ]; then npm run mock; fi

      - run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
